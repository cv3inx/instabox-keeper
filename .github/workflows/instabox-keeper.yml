name: instabox-keeper

# 免费 InstaBox 机器的「跑 7h50m → 停 10m → 继续」循环。
# GitHub 的服务器每 10 分钟来看一眼，不需要你的电脑开机，也不需要任何公网入口
# （runner 只出站访问 api.instabox.sh）。
#
# 注意：GitHub 的 cron 在高峰期可能延迟几分钟到十几分钟，最小粒度 5 分钟；
# 公开仓库的 Actions 分钟数不限，私有仓库会按分钟计费（见 README）。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instabox-keeper
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 停完要等 10 分钟再起，加上停止落地的轮询，留足余量
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run keeper
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID || 'm_agqztauvsenacuisvfppbogdle' }}
          RUN_MINUTES: '470'   # 7 小时 50 分钟
          REST_MINUTES: '10'
        run: bash keeper.sh

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name  "instabox-keeper-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "state unchanged"
          fi
